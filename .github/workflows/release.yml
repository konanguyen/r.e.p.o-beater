name: Build and Release

# Runs on every pushed v* tag. The tag MUST match ForkInfo.Version and
# AssemblyVersion in the code, otherwise the job fails before building.

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code and bundled injector dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
            10.0.x

      - name: Verify tag matches code version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) {
            Write-Host "::error::Tag '$tag' must start with 'v' (e.g. v2.6.0)."
            exit 1
          }
          $expected = $tag.Substring(1)

          $forkInfoPath = 'r.e.p.o cheat/Core/ForkInfo.cs'
          $match = [regex]::Match((Get-Content $forkInfoPath -Raw), 'Version\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            Write-Host "::error::Could not find ForkInfo.Version in $forkInfoPath"
            exit 1
          }
          $codeVersion = $match.Groups[1].Value

          $asmMatch = [regex]::Match((Get-Content 'r.e.p.o cheat/Properties/AssemblyInfo.cs' -Raw), 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)')
          if (-not $asmMatch.Success) {
            Write-Host "::error::Could not find AssemblyVersion in Properties/AssemblyInfo.cs"
            exit 1
          }
          $asmVersion = "{0}.{1}.{2}" -f $asmMatch.Groups[1].Value, $asmMatch.Groups[2].Value, $asmMatch.Groups[3].Value

          Write-Host "Tag:          $tag"
          Write-Host "ForkInfo:     $codeVersion"
          Write-Host "AssemblyInfo: $asmVersion"

          if ($codeVersion -ne $expected) {
            Write-Host "::error::Tag $tag does not match ForkInfo.Version '$codeVersion'. Update 'r.e.p.o cheat/Core/ForkInfo.cs' or fix the tag."
            exit 1
          }
          if ($asmVersion -ne $expected) {
            Write-Host "::error::Tag $tag does not match AssemblyVersion '$asmVersion'. Update Properties/AssemblyInfo.cs or fix the tag."
            exit 1
          }

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore "r.e.p.o cheat.sln"
          dotnet restore "external/SharpMonoInjector/src/SharpMonoInjector/SharpMonoInjector.csproj"
          dotnet restore "RepoInjector/RepoInjector.csproj"

      - name: Build payload DLL
        run: dotnet build "r.e.p.o cheat.sln" -c Release --no-restore --nologo

      - name: Run tests
        run: dotnet test "r.e.p.o cheat.Tests/r.e.p.o cheat.Tests.csproj" -c Release --no-restore --nologo

      - name: Publish elevated one-file injector
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          dotnet publish "RepoInjector/RepoInjector.csproj" -c Release --no-restore --nologo -o $releaseDirectory
          $launcher = Join-Path $releaseDirectory "REPOBeater.Injector.exe"
          if (-not (Test-Path -LiteralPath $launcher)) {
            throw "Expected release launcher was not produced: $launcher"
          }
          # Sanity check: the embedded payload must be the current Beater build
          $bytes = [System.IO.File]::ReadAllBytes($launcher)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains('r.e.p.o_cheat.i18n.vi.txt')) {
            throw "Embedded payload looks stale - Vietnamese i18n resource not found inside the exe."
          }
          Write-Host "Payload embedding OK. Exe size: $([math]::Round($bytes.Length / 1MB, 1)) MB"
          $hash = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  REPOBeater.Injector.exe" | Set-Content -LiteralPath "$launcher.sha256" -NoNewline

      - name: Package standalone payload DLL
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $payload = 'r.e.p.o cheat/bin/Release/r.e.p.o cheat.dll'
          if (-not (Test-Path -LiteralPath $payload)) {
            throw "Payload DLL not found: $payload"
          }
          $target = Join-Path (Join-Path $env:GITHUB_WORKSPACE "release-artifacts") "REPOBeater-v$version.dll"
          Copy-Item -LiteralPath $payload -Destination $target -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: REPO Beater ${{ github.ref_name }}
          body: |
            ### REPO Beater ${{ github.ref_name }}

            Adapted for R.E.P.O. **v0.4.4.3** (v2.6.1+ also runs safely on **v0.5.2** with degraded Steam-lobby features). Menu languages: Tiếng Việt / English / 简体中文 (Menu → Language).

            ### Downloads
            - `REPOBeater.Injector.exe` — auto-finds `repo.exe` and injects the embedded payload (no extra DLL needed)
            - `REPOBeater.Injector.exe.sha256` — checksum
            - `REPOBeater-v${{ github.ref_name }}.dll` — standalone payload for SharpMonoInjector (`-n r.e.p.o_cheat -c Loader -m Init`)

            ### Usage
            1. Start R.E.P.O. (solo / private lobby only).
            2. Run `REPOBeater.Injector.exe`, approve the UAC prompt.
            3. Press **Delete** to toggle the menu, **F10** to unload.

            Intended for solo / private-friends sessions — please respect other players.
          files: |
            release-artifacts/REPOBeater.Injector.exe
            release-artifacts/REPOBeater.Injector.exe.sha256
            release-artifacts/REPOBeater-v*.dll
          draft: false
          prerelease: false
